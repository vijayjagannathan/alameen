# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: vijayjagannathan/alameen
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/9f80bd73-7774-43dc-878c-908da6458b67/pkce
  auth_token_endpoint: /sites/9f80bd73-7774-43dc-878c-908da6458b67/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "Lodge Al-Ameen" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
